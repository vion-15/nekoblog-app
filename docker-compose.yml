
services:
  auth-db:
    image: auth-service-db:primary
    env_file:
      - path: ./auth-service/.env.development
        required: true
    volumes:
      - auth_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    networks:
      - db-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  auth-db-replica:
    image: auth-service-db:standby
    env_file:
      - path: ./auth-service/.env.db-standby
        required: true
    volumes:
      - auth_data_standby:/var/lib/postgresql
    networks:
      - db-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U auth -d auth_db &&
          psql -U auth -d auth_db -tAc
          "SELECT pg_is_in_recovery() AND EXISTS (SELECT 1 FROM pg_stat_wal_receiver WHERE status = 'streaming');"
          | grep -qx t
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  
  auth-service-back:
    build:
      context: ./auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    env_file:
      - path: ./auth-service/.env.development
        required: true
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - db-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth_data:
  auth_data_standby:

networks:
  db-net:
    driver: bridge
