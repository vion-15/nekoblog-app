
services:
  auth-db:
    image: postgres:18
    env_file:
      - path: ./auth-service/.env.development
        required: true
    volumes:
      - auth_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s
    networks:
      - db-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  
  auth-service-back:
    build:
      context: ./auth-service
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    env_file:
      - path: ./auth-service/.env.development
        required: true
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - db-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth_data:

networks:
  db-net:
    driver: bridge
